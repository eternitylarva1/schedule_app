<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>目标日历规划 - 测试原型 v2</title>
<style>
:root {
    --bg-primary:    #0d0d0f;
    --bg-secondary:  #131316;
    --bg-card:       #1a1a1f;
    --bg-elevated:   #232328;
    --bg-hover:      #2a2a30;

    --text-primary:   #fafafa;
    --text-secondary: #b0b0b8;
    --text-muted:     #6e6e76;

    --border-subtle:  #1f1f24;
    --border-medium:  #2a2a30;
    --border-strong:  #3a3a40;
    --border-color:   #2a2a30;

    --accent-primary:  #6366f1;
    --accent-success:  #22c55e;
    --accent-danger:   #ef4444;
    --accent-warning:  #f59e0b;

    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 16px;
    --space-lg: 24px;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.6);

    --transition-fast: 150ms ease;
    --transition-normal: 250ms ease;

    --row-h: 44px;
    --col-w: 48px;
    --pool-w: 260px;
    --header-h: 52px;
    --legend-h: 36px;
}
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 4px; }
*::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
* { scrollbar-width: thin; scrollbar-color: var(--border-medium) transparent; }

html, body {
    margin: 0; padding: 0;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    font-size: 13px;
    height: 100%;
    overflow: hidden;
}

.app {
    display: flex; flex-direction: column;
    height: 100vh; max-width: 100vw;
}

/* ===== Header ===== */
header {
    flex: 0 0 var(--header-h);
    padding: 0 var(--space-md);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-subtle);
    display: flex; align-items: center; gap: var(--space-md);
}
header h1 {
    margin: 0; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
}
header .desc {
    color: var(--text-muted); font-size: 12px;
}
.controls {
    display: flex; align-items: center; gap: var(--space-sm);
    margin-left: auto;
}
.btn {
    padding: 6px 12px; border-radius: var(--radius-sm);
    background: var(--bg-elevated); color: var(--text-primary);
    border: 1px solid var(--border-color);
    cursor: pointer; font-size: 12px;
    transition: background var(--transition-fast), border-color var(--transition-fast);
}
.btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
.btn.primary { background: var(--accent-primary); border-color: var(--accent-primary); color: white; }
.btn.primary:hover { background: #4f46e5; }
.btn.danger { color: var(--accent-danger); border-color: rgba(239,68,68,0.3); }
.btn.danger:hover { background: rgba(239,68,68,0.1); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
.btn.ghost:hover { background: var(--bg-elevated); }

.scale-control {
    display: flex; align-items: center; gap: 2px;
    background: var(--bg-elevated); border-radius: var(--radius-sm); padding: 2px;
    border: 1px solid var(--border-color);
}
.scale-control button {
    width: 32px; height: 22px; border: none; background: transparent;
    color: var(--text-secondary); cursor: pointer; border-radius: 4px;
    font-size: 11px;
}
.scale-control button:hover { background: var(--bg-hover); }
.scale-control button.active { background: var(--accent-primary); color: white; }

/* ===== Workspace (split: pool | calendar) ===== */
.workspace {
    flex: 1;
    display: grid;
    grid-template-columns: var(--pool-w) 1fr;
    min-height: 0;
    background: var(--bg-primary);
}

/* ===== Pool (left, sticky forever) ===== */
.pool {
    background: var(--bg-secondary);
    border-right: 1px solid var(--border-subtle);
    overflow-y: auto;
    display: flex; flex-direction: column;
}
.pool-header {
    position: sticky; top: 0;
    padding: var(--space-md);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-subtle);
    display: flex; align-items: center; justify-content: space-between;
    z-index: 5;
}
.pool-header h2 {
    margin: 0; font-size: 12px; font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.pool-count {
    background: var(--bg-elevated);
    color: var(--text-secondary);
    padding: 2px 8px;
    border-radius: var(--radius-full);
    font-size: 11px;
}
.pool-list {
    padding: var(--space-sm);
    display: flex; flex-direction: column; gap: var(--space-xs);
}
.pool-item {
    padding: 10px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-left: 3px solid var(--accent-primary);
    border-radius: var(--radius-sm);
    cursor: grab;
    transition: all var(--transition-fast);
    display: flex; align-items: center; gap: var(--space-sm);
}
.pool-item:hover {
    background: var(--bg-elevated);
    border-color: var(--border-strong);
    transform: translateX(2px);
}
.pool-item:active { cursor: grabbing; }
.pool-item.dragging {
    opacity: 0.5;
    transform: scale(0.98);
}
.pool-item .dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
}
.pool-item .name {
    flex: 1; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis;
    font-size: 13px;
    cursor: text;
    padding: 2px 4px;
    border-radius: 3px;
}
.pool-item .name:hover { background: var(--bg-elevated); }
.pool-item .name:focus {
    background: var(--bg-primary);
    outline: 1px solid var(--accent-primary);
    cursor: text;
}
.pool-item .delete {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    opacity: 0;
    transition: all var(--transition-fast);
    font-size: 14px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
}
.pool-item:hover .delete { opacity: 1; }
.pool-item .delete:hover { background: rgba(239,68,68,0.15); color: var(--accent-danger); }
.pool-empty {
    padding: var(--space-lg);
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
}

/* ===== Calendar (right, horizontally scrollable) ===== */
.calendar {
    position: relative;
    overflow-x: auto;
    overflow-y: auto;
    background: var(--bg-primary);
}
.calendar-grid {
    position: relative;
    min-width: 100%;
}
.cal-header {
    position: sticky; top: 0;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: var(--cell-w);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-subtle);
    z-index: 4;
    height: 40px;
}
.cal-header-cell {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-right: 1px solid var(--border-subtle);
    font-size: calc(11px + (var(--cell-w) - 32px) * 0.15);
    color: var(--text-secondary);
    user-select: none;
}
.cal-header-cell .dow { font-size: calc(10px + (var(--cell-w) - 32px) * 0.1); color: var(--text-muted); }
.cal-header-cell.weekend { background: rgba(255,255,255,0.02); }
.cal-header-cell.weekend .num { color: var(--text-muted); }
.cal-header-cell.today .num { color: var(--accent-primary); font-weight: 600; }
.cal-header-cell.today { background: rgba(99, 102, 241, 0.08); }
.cal-header-cell.bar-start { background: rgba(99, 102, 241, 0.22); box-shadow: inset 0 2px 0 var(--accent-primary); }
.cal-header-cell.bar-end { background: rgba(99, 102, 241, 0.22); box-shadow: inset 0 -2px 0 var(--accent-primary); }

.cal-body {
    position: relative;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: var(--cell-w);
}
.cal-cell {
    border-right: 1px solid var(--border-subtle);
    border-bottom: 1px solid var(--border-subtle);
    min-height: var(--row-h);
    position: relative;
}
.cal-cell.weekend { background: rgba(255,255,255,0.02); }
.cal-cell.today { background: rgba(99, 102, 241, 0.06); }
.cal-cell.drop-target {
    background: rgba(99, 102, 241, 0.15);
    outline: 1px dashed var(--accent-primary);
    outline-offset: -1px;
}

/* Row groupings for goals */
.cal-row-group {
    position: relative;
    border-bottom: 1px solid var(--border-subtle);
}
.cal-row-group-header {
    position: sticky; left: 0;
    padding: 6px 12px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-subtle);
    display: flex; align-items: center; gap: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    height: 28px;
    z-index: 3;
}
.cal-row-group-header .dot {
    width: 8px; height: 8px; border-radius: 50%;
}
.cal-row-group-header .name {
    font-weight: 600; color: var(--text-primary);
}
.cal-row-group-header .meta {
    margin-left: auto;
    font-size: 11px; color: var(--text-muted);
}
.cal-row-group-header .group-delete {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    opacity: 0;
    transition: all var(--transition-fast);
    margin-left: var(--space-sm);
}
.cal-row-group-header:hover .group-delete { opacity: 1; }
.cal-row-group-header .group-delete:hover {
    background: rgba(239,68,68,0.15);
    color: var(--accent-danger);
}
.cal-row {
    position: relative;
    height: var(--row-h);
    border-bottom: 1px solid var(--border-subtle);
}

/* Bars (scheduled tasks) */
.bar {
    position: absolute;
    height: 28px;
    top: calc((var(--row-h) - 28px) / 2);
    border-radius: var(--radius-sm);
    display: flex; align-items: center;
    padding: 0 8px;
    color: white; font-size: 12px;
    cursor: grab;
    box-shadow: var(--shadow-sm);
    user-select: none;
    z-index: 2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: box-shadow var(--transition-fast), transform var(--transition-fast);
}
.bar:hover { box-shadow: var(--shadow-md); }
.bar:active { cursor: grabbing; }
.bar.dragging {
    z-index: 10;
    box-shadow: var(--shadow-lg);
    transform: scale(1.02);
}
.bar .handle {
    position: absolute; top: 0; bottom: 0;
    width: 6px; cursor: ew-resize;
    opacity: 0;
    transition: opacity var(--transition-fast);
}
.bar:hover .handle { opacity: 1; }
.bar .handle.left { left: 0; border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.bar .handle.right { right: 0; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }

/* Delete button on bar (hover-revealed) */
.bar .bar-delete {
    position: absolute;
    right: 4px; top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.4);
    color: white;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    opacity: 0;
    transition: opacity var(--transition-fast), background var(--transition-fast);
    display: flex; align-items: center; justify-content: center;
    padding: 0;
}
.bar:hover .bar-delete { opacity: 1; }
.bar .bar-delete:hover { background: var(--accent-danger); }

/* Today line */
.today-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: var(--accent-primary);
    z-index: 3;
    pointer-events: none;
}
.today-line::before {
    content: '';
    position: absolute;
    top: -4px; left: -3px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent-primary);
}

/* Legend / status bar */
.legend {
    flex: 0 0 var(--legend-h);
    padding: 0 var(--space-md);
    background: var(--bg-secondary);
    border-top: 1px solid var(--border-subtle);
    color: var(--text-muted); font-size: 11px;
    display: flex; align-items: center; gap: var(--space-lg);
    overflow-x: auto;
    white-space: nowrap;
}
.legend kbd {
    background: var(--bg-elevated);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: monospace;
    font-size: 10px;
    color: var(--text-secondary);
    margin-right: 4px;
}
#status { margin-left: auto; color: var(--accent-primary); }

/* Toast */
.toast {
    position: fixed; bottom: calc(var(--legend-h) + 16px); left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg-elevated);
    border: 1px solid var(--border-strong);
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
    box-shadow: var(--shadow-md);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Ghost (drag preview) */
.drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 1000;
    background: var(--accent-primary);
    color: white;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    box-shadow: var(--shadow-lg);
    opacity: 0.9;
    transform: translate(-50%, -50%);
}

</style>
</head>
<body>
<div class="app">
    <header>
        <h1>🎯 目标日历规划</h1>
        <span class="desc">从左侧拖入日历分配时间</span>
        <div class="controls">
            <div class="scale-control" id="scale">
                <button data-scale="0.5">×0.5</button>
                <button data-scale="1" class="active">×1</button>
                <button data-scale="2">×2</button>
            </div>
            <button class="btn ghost" id="prev">‹</button>
            <button class="btn" id="today">今天</button>
            <button class="btn ghost" id="next">›</button>
            <button class="btn primary" id="add-task">+ 任务</button>
            <button class="btn primary" id="add-goal">+ 目标</button>
            <button class="btn danger" id="reset">重置</button>
        </div>
    </header>
    <div class="workspace">
        <aside class="pool" id="pool">
            <div class="pool-header">
                <h2>未分配时间</h2>
                <span class="pool-count" id="pool-count">0</span>
            </div>
            <div class="pool-list" id="pool-list"></div>
        </aside>
        <div class="calendar" id="calendar">
            <div class="calendar-grid" id="cal-grid"></div>
        </div>
    </div>
    <div class="legend">
        <span><kbd>拖池子</kbd> 分配时间</span>
        <span><kbd>拖两端</kbd> 改时长</span>
        <span><kbd>拖中间</kbd> 平移</span>
        <span><kbd>双击块</kbd> 编辑</span>
        <span id="status"></span>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
const BASE_COL_W = 48;
const ROW_H = 44;
const POOL_W = 260;

// ---- Mock data ----
const DEFAULT_DATA = {
    scheduled: [
        {
            id: 1, title: '毕业设计', color: '#6366f1',
            start: '2026-08-25', end: '2026-09-30',
            tasks: [
                { id: 11, title: '需求分析', start: '2026-08-25', end: '2026-09-02' },
                { id: 12, title: '系统设计', start: '2026-09-03', end: '2026-09-12' },
                { id: 13, title: '编码实现', start: '2026-09-13', end: '2026-09-25' },
                { id: 14, title: '测试与答辩', start: '2026-09-26', end: '2026-09-30' },
            ],
        },
        {
            id: 2, title: '考研复习', color: '#10b981',
            start: '2026-08-20', end: '2026-11-15',
            tasks: [
                { id: 21, title: '英语阅读', start: '2026-08-20', end: '2026-09-20' },
                { id: 22, title: '数学基础', start: '2026-08-25', end: '2026-10-15' },
                { id: 23, title: '政治冲刺', start: '2026-10-20', end: '2026-11-15' },
            ],
        },
        {
            id: 3, title: '健身计划', color: '#f59e0b',
            start: '2026-08-26', end: '2026-10-30',
            tasks: [
                { id: 31, title: '增肌期', start: '2026-08-26', end: '2026-09-30' },
                { id: 32, title: '减脂期', start: '2026-10-01', end: '2026-10-30' },
            ],
        },
    ],
    unscheduled: [
        { id: 101, title: '阅读《代码大全》', color: '#ec4899' },
        { id: 102, title: '准备周报', color: '#06b6d4' },
        { id: 103, title: '复盘本月工作', color: '#a855f7' },
        { id: 104, title: '联系导师', color: '#f97316' },
        { id: 105, title: '买跑鞋', color: '#84cc16' },
    ],
};

let data = JSON.parse(JSON.stringify(DEFAULT_DATA));
let scale = 1;
let rangeStart = null;
let rangeEnd = null;
let viewOffsetDays = 0; // shifts the visible window without recompute

// ---- Date helpers ----
function ymd(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(s, n) {
    const d = typeof s === 'string' ? new Date(s) : new Date(s);
    d.setDate(d.getDate() + n);
    return ymd(d);
}
function daysBetween(a, b) {
    return Math.round((new Date(b).getTime() - new Date(a).getTime()) / 86400000);
}
function today() { return ymd(new Date()); }

function recomputeRange() {
    const all = [];
    data.scheduled.forEach(g => {
        all.push(g.start, g.end);
        g.tasks.forEach(t => all.push(t.start, t.end));
    });
    let baseStart, baseEnd;
    if (all.length === 0) {
        const t = new Date();
        baseStart = ymd(t);
        baseEnd = ymd(t);
    } else {
        const min = all.reduce((a, b) => a < b ? a : b);
        const max = all.reduce((a, b) => a > b ? a : b);
        baseStart = addDays(min, -5);
        baseEnd = addDays(max, 5);
    }
    rangeStart = addDays(baseStart, viewOffsetDays);
    rangeEnd = addDays(baseEnd, viewOffsetDays);
}

// ---- Render ----
function render() {
    recomputeRange();
    const totalDays = daysBetween(rangeStart, rangeEnd) + 1;
    const cellW = BASE_COL_W * scale;

    const calendar = document.getElementById('calendar');
    const grid = document.getElementById('cal-grid');
    calendar.style.setProperty('--cell-w', cellW + 'px');

    let html = '';

    // Header row
    html += '<div class="cal-header">';
    for (let i = 0; i < totalDays; i++) {
        const d = addDays(rangeStart, i);
        const dt = new Date(d);
        const dow = dt.getDay();
        const isWeekend = dow === 0 || dow === 6;
        const isToday = d === today();
        const dowLabel = ['日','一','二','三','四','五','六'][dow];
        const showMonth = i === 0 || dt.getDate() === 1;
        html += `<div class="cal-header-cell${isWeekend?' weekend':''}${isToday?' today':''}">
            <span class="dow">${dowLabel}${showMonth ? ' · ' + (dt.getMonth()+1) + '月' : ''}</span>
            <span class="num">${dt.getDate()}</span>
        </div>`;
    }
    html += '</div>';

    // Body: one row group per scheduled goal, each containing a row per task
    data.scheduled.forEach(g => {
        const groupStart = daysBetween(rangeStart, g.start);
        const groupEnd = daysBetween(rangeStart, g.end);
        html += `<div class="cal-row-group" data-group-id="${g.id}">`;
        // group header (sticky to left? no, spans full width)
        html += `<div class="cal-row-group-header" style="grid-column: 1 / span ${totalDays}" data-group-id="${g.id}">
            <span class="dot" style="background:${g.color}"></span>
            <span class="name">${escapeHtml(g.title)}</span>
            <span class="meta">${g.start} ~ ${g.end} · ${daysBetween(g.start, g.end) + 1}天 · ${g.tasks.length}项任务</span>
            <button class="group-delete" title="删除整个目标">×</button>
        </div>`;
        // tasks
        g.tasks.forEach(t => {
            const startIdx = daysBetween(rangeStart, t.start);
            const span = daysBetween(t.start, t.end) + 1;
            const left = startIdx * cellW;
            const width = span * cellW;
            html += `<div class="cal-row" style="grid-column: ${startIdx + 1} / span ${span}" data-group-id="${g.id}">
                <div class="bar" data-id="${t.id}" data-group="${g.id}"
                     style="left:${left}px;width:${width}px;background:${g.color}"
                     title="${escapeHtml(t.title)} (${t.start} ~ ${t.end})">
                    <span class="bar-text">${escapeHtml(t.title)}</span>
                    <button class="bar-delete" title="删除任务">×</button>
                    <div class="handle left" data-handle="left"></div>
                    <div class="handle right" data-handle="right"></div>
                </div>
            </div>`;
        });
        html += `</div>`;
    });

    if (data.scheduled.length === 0) {
        html += `<div style="grid-column: 1 / span ${totalDays}; padding: 60px; text-align:center; color: var(--text-muted)">
            把左侧任务拖到这里来分配时间
        </div>`;
    }

    grid.innerHTML = html;

    // Today line
    const todayIdx = daysBetween(rangeStart, today());
    const gridRect = grid.getBoundingClientRect();
    const calendarRect = calendar.getBoundingClientRect();
    const todayX = todayIdx * cellW;
    let line = grid.querySelector('.today-line');
    if (!line) {
        line = document.createElement('div');
        line.className = 'today-line';
        grid.appendChild(line);
    }
    line.style.left = todayX + 'px';
    line.style.height = grid.offsetHeight + 'px';

    // Drop targets for drag-from-pool
    grid.querySelectorAll('.cal-row').forEach(row => {
        row.addEventListener('dragover', onRowDragOver);
        row.addEventListener('dragleave', onRowDragLeave);
        row.addEventListener('drop', onRowDrop);
    });

    // Bar interactions
    grid.querySelectorAll('.bar').forEach(bar => {
        bar.addEventListener('pointerdown', onBarPointerDown);
        bar.addEventListener('dblclick', onBarDblClick);
        bar.addEventListener('click', onBarClick);
        const del = bar.querySelector('.bar-delete');
        if (del) {
            del.addEventListener('click', e => {
                e.stopPropagation();
                const taskId = parseInt(bar.dataset.id);
                const groupId = parseInt(bar.dataset.group);
                const group = data.scheduled.find(g => g.id === groupId);
                if (!group) return;
                group.tasks = group.tasks.filter(t => t.id !== taskId);
                if (group.tasks.length === 0) {
                    data.scheduled = data.scheduled.filter(g => g.id !== groupId);
                }
                if (selectedBarId === taskId) selectedBarId = null;
                render();
                showToast('已删除任务');
            });
        }
    });

    // Group header × delete button
    grid.querySelectorAll('.cal-row-group-header').forEach(hdr => {
        const btn = hdr.querySelector('.group-delete');
        if (!btn) return;
        btn.addEventListener('click', e => {
            e.stopPropagation();
            const groupId = parseInt(hdr.dataset.groupId);
            const group = data.scheduled.find(g => g.id === groupId);
            if (!group) return;
            // Move all tasks back to unscheduled pool
            group.tasks.forEach(t => {
                data.unscheduled.push({ id: t.id, title: t.title, color: group.color });
            });
            data.scheduled = data.scheduled.filter(g => g.id !== groupId);
            selectedBarId = null;
            render();
            showToast(`已删除目标: ${group.title}`);
        });
    });

    // Restore selection highlight if any
    if (selectedBarId != null) {
        const bar = grid.querySelector(`.bar[data-id="${selectedBarId}"]`);
        if (bar) selectBar(bar);
    }

    renderPool();
    restoreScroll();
}

function renderPool() {
    const list = document.getElementById('pool-list');
    const count = document.getElementById('pool-count');
    count.textContent = data.unscheduled.length;

    if (data.unscheduled.length === 0) {
        list.innerHTML = '<div class="pool-empty">全部任务都已分配时间 ✨</div>';
        return;
    }
    list.innerHTML = data.unscheduled.map(item => `
        <div class="pool-item" data-id="${item.id}"
             style="border-left-color: ${item.color}">
            <span class="dot" style="background:${item.color}"></span>
            <span class="name" spellcheck="false">${escapeHtml(item.title)}</span>
            <button class="delete" title="删除">×</button>
        </div>
    `).join('');

    list.querySelectorAll('.pool-item').forEach(el => {
        const nameEl = el.querySelector('.name');
        const item = data.unscheduled.find(x => x.id === parseInt(el.dataset.id));

        // Pointer-down anywhere on the row → start drag-to-calendar
        el.addEventListener('pointerdown', e => {
            if (e.target.closest('.delete')) return; // × button handles itself
            if (nameEl.getAttribute('contenteditable') === 'true') return; // editing
            startPoolDrag(e, el, item);
        });

        // Double-click on name to enter edit mode
        nameEl.addEventListener('dblclick', e => {
            e.stopPropagation();
            nameEl.setAttribute('contenteditable', 'true');
            nameEl.focus();
            const range = document.createRange();
            range.selectNodeContents(nameEl);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        });

        // Real-time sync to data on every keystroke (don't wait for blur)
        nameEl.addEventListener('input', () => {
            const v = nameEl.textContent.trim();
            if (v && item) item.title = v;
        });

        // Cleanup: turn off contenteditable on blur
        nameEl.addEventListener('blur', () => {
            if (nameEl.getAttribute('contenteditable') === 'true') {
                nameEl.removeAttribute('contenteditable');
                const newTitle = nameEl.textContent.trim();
                if (!newTitle && item) {
                    nameEl.textContent = item.title; // restore if emptied
                } else if (newTitle && item) {
                    item.title = newTitle;
                }
                // Re-render the pool so the saved title is reflected consistently
                // (input already updated data in real-time, this just re-syncs DOM)
                renderPool();
            }
        });
        nameEl.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); }
            else if (e.key === 'Escape') {
                if (item) nameEl.textContent = item.title;
                nameEl.blur();
            }
        });

        el.querySelector('.delete').addEventListener('click', e => {
            e.stopPropagation();
            if (item) {
                data.unscheduled = data.unscheduled.filter(x => x.id !== item.id);
                renderPool();
                showToast(`已删除: ${item.title}`);
            }
        });
    });
}

// ---- Drag from pool: pointer-based (click & drag directly) ----
let poolDrag = null;
const DRAG_THRESHOLD = 5; // px before a pointerdown becomes a real drag

function startPoolDrag(e, el, item) {
    if (!item) return;
    // CRITICAL: do NOT preventDefault or setPointerCapture here.
    // preventDefault on pointerdown suppresses the synthesized mousedown,
    // which kills click → dblclick. We only commit to a real drag once the
    // pointer moves past the threshold.
    poolDrag = {
        el, item,
        ghost: null,
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        active: false,
    };

    el.addEventListener('pointermove', onPoolPointerMove);
    el.addEventListener('pointerup', onPoolPointerUp);
    el.addEventListener('pointercancel', onPoolPointerUp);
}

function onPoolPointerMove(e) {
    if (!poolDrag) return;
    if (!poolDrag.active) {
        const dx = e.clientX - poolDrag.startX;
        const dy = e.clientY - poolDrag.startY;
        if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return; // not a drag yet
        // Promote to active drag — NOW safe to preventDefault + capture pointer
        poolDrag.active = true;
        e.preventDefault();
        try { poolDrag.el.setPointerCapture(poolDrag.pointerId); } catch (_) {}
        poolDrag.el.classList.add('dragging');
        const ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.textContent = poolDrag.item.title;
        document.body.appendChild(ghost);
        ghost.style.left = e.clientX + 'px';
        ghost.style.top = e.clientY + 'px';
        poolDrag.ghost = ghost;
    }
    if (poolDrag.ghost) {
        poolDrag.ghost.style.left = e.clientX + 'px';
        poolDrag.ghost.style.top = e.clientY + 'px';
    }
    // Highlight the calendar cell under pointer
    document.querySelectorAll('.cal-row.drop-target').forEach(el => el.classList.remove('drop-target'));
    const elUnder = document.elementFromPoint(e.clientX, e.clientY);
    const row = elUnder?.closest('.cal-row');
    if (row) row.classList.add('drop-target');
}

function onPoolPointerUp(e) {
    if (!poolDrag) return;
    const { el, item, ghost, active } = poolDrag;
    if (active) {
        try { el.releasePointerCapture(poolDrag.pointerId); } catch (_) {}
    }
    el.removeEventListener('pointermove', onPoolPointerMove);
    el.removeEventListener('pointerup', onPoolPointerUp);
    el.removeEventListener('pointercancel', onPoolPointerUp);
    // If drag never activated (no movement), treat as a click — let dblclick fire.
    if (!active) {
        el.classList.remove('dragging');
        poolDrag = null;
        return;
    }
    el.classList.remove('dragging');
    if (ghost) ghost.remove();
    document.querySelectorAll('.cal-row.drop-target').forEach(el => el.classList.remove('drop-target'));

    const elUnder = document.elementFromPoint(e.clientX, e.clientY);
    const row = elUnder?.closest('.cal-row');
    if (row) {
        const cellW = BASE_COL_W * scale;
        const rect = row.getBoundingClientRect();
        const dayIdx = Math.floor((e.clientX - rect.left) / cellW);
        const start = addDays(rangeStart, dayIdx);
        const end = addDays(start, 2);
        data.unscheduled = data.unscheduled.filter(x => x.id !== item.id);
        const newTask = { id: item.id, title: item.title, start, end };
        // Find the goal group this row belongs to (set during render)
        const groupId = parseInt(row.dataset.groupId);
        const targetGroup = data.scheduled.find(g => g.id === groupId);
        if (targetGroup) {
            targetGroup.tasks.push(newTask);
        } else if (data.scheduled.length === 0) {
            data.scheduled.push({
                id: (Date.now() & 0xffff) + 1000,
                title: '新目标',
                color: item.color,
                start, end,
                tasks: [newTask],
            });
        } else {
            // Fallback: drop into first goal
            data.scheduled[0].tasks.push(newTask);
        }
        render();
        showToast(`已分配: ${item.title} → ${targetGroup ? targetGroup.title : '新目标'}`);
    }
    poolDrag = null;
}

// ---- Old HTML5 drag handlers (kept as no-ops, in case any leftover reference) ----
function onPoolDragStart(e) { e.preventDefault(); }
function onPoolDragEnd(e) { /* no-op */ }

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- Drag from pool ----
function onPoolDragStart(e) {
    const item = e.currentTarget;
    const id = parseInt(item.dataset.id);
    e.dataTransfer.effectAllowed = 'copy';
    e.dataTransfer.setData('text/plain', String(id));
    item.classList.add('dragging');
}
function onPoolDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
}
function onRowDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    e.currentTarget.classList.add('drop-target');
}
function onRowDragLeave(e) {
    if (!e.currentTarget.contains(e.relatedTarget)) {
        e.currentTarget.classList.remove('drop-target');
    }
}
function onRowDrop(e) {
    e.preventDefault();
    e.currentTarget.classList.remove('drop-target');
    const id = parseInt(e.dataTransfer.getData('text/plain'));
    const item = data.unscheduled.find(x => x.id === id);
    if (!item) return;
    // Find which day was dropped on
    const row = e.currentTarget;
    const rect = row.getBoundingClientRect();
    const cellW = BASE_COL_W * scale;
    const dayIdx = Math.floor((e.clientX - rect.left) / cellW);
    const start = addDays(rangeStart, dayIdx);
    // Default duration: 3 days
    const end = addDays(start, 2);
    // Remove from pool, add to first scheduled group (or create new)
    data.unscheduled = data.unscheduled.filter(x => x.id !== id);
    const newTask = { id: id, title: item.title, start, end };
    if (data.scheduled.length === 0) {
        data.scheduled.push({
            id: Date.now() & 0xffff,
            title: '新目标',
            color: item.color,
            start, end,
            tasks: [newTask],
        });
    } else {
        data.scheduled[0].tasks.push(newTask);
    }
    render();
    showToast(`已分配: ${item.title} (${start} ~ ${end})`);
}

// ---- Bar drag (resize/move) ----
let drag = null;
let selectedBarId = null;

function onBarClick(e) {
    // Will be triggered after dblclick-window closes
    if (e.detail === 2) return; // double click skip
    const bar = e.currentTarget;
    selectBar(bar);
}

function selectBar(bar) {
    // Clear previous highlights
    document.querySelectorAll('.cal-header-cell.bar-start, .cal-header-cell.bar-end')
        .forEach(el => el.classList.remove('bar-start', 'bar-end'));
    document.querySelectorAll('.bar.selected').forEach(el => el.classList.remove('selected'));
    bar.classList.add('selected');
    selectedBarId = parseInt(bar.dataset.id);

    const taskId = parseInt(bar.dataset.id);
    const groupId = parseInt(bar.dataset.group);
    const group = data.scheduled.find(g => g.id === groupId);
    const task = group?.tasks.find(t => t.id === taskId);
    if (!task) return;

    // Highlight start/end cells in header
    const startIdx = daysBetween(rangeStart, task.start);
    const endIdx = daysBetween(rangeStart, task.end);
    const headerCells = document.querySelectorAll('.cal-header-cell');
    if (headerCells[startIdx]) headerCells[startIdx].classList.add('bar-start');
    if (headerCells[endIdx]) headerCells[endIdx].classList.add('bar-end');

    setStatus(`${task.title}: ${task.start} → ${task.end}`);
}

function onBarPointerDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    const bar = e.currentTarget;
    if (e.target.closest('.bar-delete')) return; // × button handles itself
    const handle = e.target.closest('.handle');
    const taskId = parseInt(bar.dataset.id);
    const groupId = parseInt(bar.dataset.group);
    const group = data.scheduled.find(g => g.id === groupId);
    const task = group?.tasks.find(t => t.id === taskId);
    if (!group || !task) return;

    e.preventDefault();
    e.stopPropagation();
    bar.setPointerCapture(e.pointerId);
    bar.classList.add('dragging');

    drag = {
        bar, task, group,
        handle: handle ? handle.dataset.handle : 'body',
        startX: e.clientX,
        origStart: task.start,
        origEnd: task.end,
        moved: false,
    };
    bar.addEventListener('pointermove', onBarPointerMove);
    bar.addEventListener('pointerup', onBarPointerUp);
    bar.addEventListener('pointercancel', onBarPointerUp);
}
function onBarPointerMove(e) {
    if (!drag) return;
    const cellW = BASE_COL_W * scale;
    const dx = e.clientX - drag.startX;
    const delta = Math.round(dx / cellW);
    if (delta === 0) return;

    let s = drag.origStart, en = drag.origEnd;
    if (drag.handle === 'left') {
        s = addDays(drag.origStart, delta);
        if (new Date(s) > new Date(en)) return;
    } else if (drag.handle === 'right') {
        en = addDays(drag.origEnd, delta);
        if (new Date(en) < new Date(s)) return;
    } else {
        s = addDays(drag.origStart, delta);
        en = addDays(drag.origEnd, delta);
    }
    drag.task.start = s;
    drag.task.end = en;
    drag.moved = true;
    drag.group.start = data.scheduled.map(g => g.start).reduce((a,b) => a < b ? a : b);
    drag.group.end = data.scheduled.map(g => g.end).reduce((a,b) => a > b ? a : b);

    const startIdx = daysBetween(rangeStart, s);
    const span = daysBetween(s, en) + 1;
    drag.bar.style.left = (startIdx * cellW) + 'px';
    drag.bar.style.width = (span * cellW) + 'px';
    drag.bar.title = `${drag.task.title} (${s} ~ ${en})`;
    setStatus(`${s} ~ ${en}`);
}
function onBarPointerUp(e) {
    if (!drag) return;
    const moved = drag.moved;
    const title = drag.task.title;
    const start = drag.task.start;
    const end = drag.task.end;
    drag.bar.classList.remove('dragging');
    drag.bar.releasePointerCapture(e.pointerId);
    drag.bar.removeEventListener('pointermove', onBarPointerMove);
    drag.bar.removeEventListener('pointerup', onBarPointerUp);
    drag.bar.removeEventListener('pointercancel', onBarPointerUp);
    setStatus('');
    if (moved) {
        showToast(`已更新: ${title} (${start} ~ ${end})`);
    }
    // Keep selection after drag for date highlight
    selectBar(drag.bar);
    drag = null;
}
function onBarDblClick(e) {
    const bar = e.currentTarget;
    const taskId = parseInt(bar.dataset.id);
    const groupId = parseInt(bar.dataset.group);
    const group = data.scheduled.find(g => g.id === groupId);
    const task = group?.tasks.find(t => t.id === taskId);
    if (!task) return;
    openInlineEditor(bar, task, group);
}

// Global fallback: clicking anywhere commits any active inline edit.
// Some click targets (bars with pointer capture) intercept focus/blur, so we
// explicitly blur the active editable element before the click is processed.
document.addEventListener('pointerdown', e => {
    const active = document.activeElement;
    if (active && active.getAttribute('contenteditable') === 'true' && !active.contains(e.target)) {
        active.blur();
    }
}, true);

function openInlineEditor(bar, task, group) {
    // Close any existing editor
    document.querySelectorAll('.inline-editor').forEach(el => el.remove());

    const editor = document.createElement('div');
    editor.className = 'inline-editor';
    const barRect = bar.getBoundingClientRect();
    editor.style.cssText = `
        position: fixed;
        left: ${barRect.left}px;
        top: ${barRect.top}px;
        width: ${Math.max(barRect.width, 200)}px;
        height: ${barRect.height}px;
        background: var(--bg-elevated);
        border: 1px solid var(--accent-primary);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-lg);
        z-index: 1000;
        display: flex; align-items: center;
        padding: 0 8px;
        gap: 6px;
    `;
    const input = document.createElement('input');
    input.type = 'text';
    input.value = task.title;
    input.style.cssText = `
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text-primary);
        font-size: 12px;
        font-family: inherit;
    `;
    const dateInput = document.createElement('input');
    dateInput.type = 'date';
    dateInput.value = task.start;
    dateInput.title = '修改开始日期';
    dateInput.style.cssText = `
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        color: var(--text-primary);
        padding: 2px 4px;
        font-size: 11px;
        color-scheme: dark;
    `;
    const delBtn = document.createElement('button');
    delBtn.textContent = '×';
    delBtn.title = '删除';
    delBtn.style.cssText = `
        background: transparent;
        border: none;
        color: var(--accent-danger);
        cursor: pointer;
        font-size: 16px;
        padding: 0 4px;
    `;
    const saveAndClose = () => {
        const newTitle = input.value.trim();
        if (newTitle) task.title = newTitle;
        if (dateInput.value) {
            task.start = dateInput.value;
            // If end < new start, push end forward
            if (new Date(task.end) < new Date(task.start)) {
                task.end = task.start;
            }
        }
        // Recompute group range
        group.start = group.tasks.reduce((a, t) => a < t.start ? a : t.start, group.tasks[0].start);
        group.end = group.tasks.reduce((a, t) => a > t.end ? a : t.end, group.tasks[0].end);
        editor.remove();
        render();
        showToast(`已保存: ${task.title}`);
    };
    const cancel = () => editor.remove();
    const remove = () => {
        group.tasks = group.tasks.filter(t => t.id !== task.id);
        if (group.tasks.length === 0) {
            data.scheduled = data.scheduled.filter(g => g.id !== group.id);
            data.unscheduled.push({ id: task.id, title: task.title, color: group.color });
        }
        editor.remove();
        render();
        showToast(`已移除: ${task.title}`);
    };

    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') saveAndClose();
        else if (e.key === 'Escape') cancel();
        e.stopPropagation();
    });
    // Save when input loses focus (clicking outside)
    input.addEventListener('blur', saveAndClose);
    dateInput.addEventListener('keydown', e => e.stopPropagation());
    dateInput.addEventListener('change', saveAndClose);
    // If focus moves to dateInput or delBtn, don't treat as blur-and-close
    dateInput.addEventListener('focus', e => input.removeEventListener('blur', saveAndClose));
    delBtn.addEventListener('focus', e => input.removeEventListener('blur', saveAndClose));
    delBtn.addEventListener('click', e => { e.stopPropagation(); remove(); });

    editor.appendChild(input);
    editor.appendChild(dateInput);
    editor.appendChild(delBtn);
    document.body.appendChild(editor);
    input.focus();
    input.select();
}

// ---- Scroll persistence ----
function restoreScroll() {
    const cal = document.getElementById('calendar');
    const todayIdx = daysBetween(rangeStart, today());
    const cellW = BASE_COL_W * scale;
    cal.scrollLeft = Math.max(0, (todayIdx - 5) * cellW);
}

// ---- UI helpers ----
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}
function setStatus(msg) {
    document.getElementById('status').textContent = msg;
}

// ---- Controls ----
document.getElementById('scale').addEventListener('click', e => {
    const btn = e.target.closest('button[data-scale]');
    if (!btn) return;
    document.querySelectorAll('#scale button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    scale = parseFloat(btn.dataset.scale);
    render();
});
document.getElementById('today').addEventListener('click', () => {
    viewOffsetDays = 0;
    render();
});
document.getElementById('reset').addEventListener('click', () => {
    data = JSON.parse(JSON.stringify(DEFAULT_DATA));
    viewOffsetDays = 0;
    render();
    showToast('已重置数据');
});
document.getElementById('add-task').addEventListener('click', () => {
    const id = Date.now() & 0xffff;
    data.unscheduled.push({
        id,
        title: '新任务',
        color: ['#6366f1','#10b981','#f59e0b','#ec4899','#06b6d4'][data.unscheduled.length % 5],
    });
    renderPool();
    // Auto-enter edit mode on the newly created item
    setTimeout(() => {
        const el = document.querySelector(`.pool-item[data-id="${id}"] .name`);
        if (el) {
            el.setAttribute('contenteditable', 'true');
            el.focus();
            const range = document.createRange();
            range.selectNodeContents(el);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        }
    }, 50);
});

document.getElementById('add-goal').addEventListener('click', () => {
    openGoalCreator();
});

function openGoalCreator() {
    closeContextMenu();
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1999;display:flex;align-items:center;justify-content:center;';

    const dialog = document.createElement('div');
    dialog.style.cssText = `
        background: var(--bg-secondary);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        padding: var(--space-lg);
        width: min(90vw, 380px);
        box-shadow: var(--shadow-lg);
    `;
    dialog.innerHTML = `
        <h3 style="margin:0 0 var(--space-md);font-size:15px;color:var(--text-primary)">新建目标</h3>
        <div style="margin-bottom:var(--space-sm)">
            <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px">目标名称</label>
            <input type="text" id="goal-name" placeholder="例如：毕业设计" style="width:100%;padding:8px;background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border-color);border-radius:var(--radius-sm);font-size:13px;outline:none;box-sizing:border-box;" />
        </div>
        <div style="margin-bottom:var(--space-sm)">
            <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px">起始日期</label>
            <input type="date" id="goal-start" style="width:100%;padding:8px;background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border-color);border-radius:var(--radius-sm);font-size:13px;color-scheme:dark;box-sizing:border-box;" />
        </div>
        <div style="margin-bottom:var(--space-md)">
            <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px">颜色</label>
            <div id="goal-colors" style="display:flex;gap:8px;flex-wrap:wrap"></div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
            <button id="goal-cancel" style="padding:6px 14px;background:transparent;border:1px solid var(--border-color);color:var(--text-secondary);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;">取消</button>
            <button id="goal-confirm" style="padding:6px 14px;background:var(--accent-primary);border:none;color:white;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;">创建</button>
        </div>
    `;

    backdrop.appendChild(dialog);
    document.body.appendChild(backdrop);

    // Color picker
    const colors = ['#6366f1','#10b981','#f59e0b','#ec4899','#06b6d4','#a855f7','#f97316','#84cc16'];
    let pickedColor = colors[0];
    const colorBox = dialog.querySelector('#goal-colors');
    colors.forEach(c => {
        const sw = document.createElement('div');
        sw.style.cssText = `width:24px;height:24px;border-radius:50%;background:${c};cursor:pointer;border:2px solid transparent;transition:transform 0.1s;`;
        sw.dataset.color = c;
        sw.addEventListener('click', () => {
            pickedColor = c;
            colorBox.querySelectorAll('div').forEach(x => x.style.borderColor = 'transparent');
            sw.style.borderColor = 'var(--text-primary)';
        });
        colorBox.appendChild(sw);
    });
    colorBox.firstChild.style.borderColor = 'var(--text-primary)';

    const nameInput = dialog.querySelector('#goal-name');
    const startInput = dialog.querySelector('#goal-start');
    startInput.value = today();

    const cleanup = () => backdrop.remove();
    dialog.querySelector('#goal-cancel').addEventListener('click', cleanup);
    backdrop.addEventListener('click', e => { if (e.target === backdrop) cleanup(); });

    const create = () => {
        const title = nameInput.value.trim();
        if (!title) { nameInput.focus(); return; }
        const start = startInput.value || today();
        const id = (Date.now() & 0xffff) + 1000;
        data.scheduled.push({
            id, title, color: pickedColor,
            start, end: addDays(start, 6),
            tasks: [],
        });
        viewOffsetDays = 0;
        cleanup();
        render();
        showToast(`已创建目标: ${title}`);
    };
    dialog.querySelector('#goal-confirm').addEventListener('click', create);
    nameInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') create();
        else if (e.key === 'Escape') cleanup();
    });

    setTimeout(() => nameInput.focus(), 50);
}
document.getElementById('prev').addEventListener('click', () => {
    viewOffsetDays -= 14;
    render();
});
document.getElementById('next').addEventListener('click', () => {
    viewOffsetDays += 14;
    render();
});

render();
</script>
</body>
</html>
